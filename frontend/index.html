<!doctype html>
<html lang="id" data-theme="stayin">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/stayine-logo-2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Stay In</title>
  </head>
  <body>
    <div id="root"></div>
    <script id="midtrans-snap-script" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="%VITE_MT_CLIENT_KEY%"></script>
    <script>
      // Global callback helper (used by RoomBuyModel and ServiceBuyModel callbacks)
      window.__STAYIN_ENV__ = {
        API_URL: "%VITE_API_URL%"
      };

      window.__stayinMidtransCallback = async function(event, payload, meta, callbackUrl) {
        try {
          var base = (window.__STAYIN_ENV__ && window.__STAYIN_ENV__.API_URL) ? String(window.__STAYIN_ENV__.API_URL) : "";
          if (!base) {
            console.warn("VITE_API_URL missing; cannot POST callback");
            return;
          }
          base = base.replace(/\/+$/, "");

          // Default to payments/callback if no callbackUrl provided
          var endpoint = callbackUrl || "/api/payments/callback";

          var resp = await fetch(base + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign({ event: event, payload: payload }, meta || {}))
          });
          var text = await resp.text();
          console.log("[" + endpoint + "]", resp.status, text);
          return text;
        } catch (e) {
          console.error("[callback] failed:", e);
        }
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
